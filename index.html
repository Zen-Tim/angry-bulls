<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light only">
<title>Angry Bulls v2.1</title>
<style>
:root{color-scheme:light only;--ink:#1E1410;--cream:#F7EFE1;--red:#D9453A;--green:#2E9E5B;--paper:#FFFFFF;--mute:#6B5A4A}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);-webkit-text-size-adjust:100%}
body,canvas{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:"Trebuchet MS","Verdana",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100dvh;padding:16px 12px 28px}
header{width:100%;max-width:1000px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:30px;letter-spacing:1px;margin:0;text-transform:uppercase}
.sub{font-size:13px;letter-spacing:3px;color:var(--red);text-transform:uppercase}
#picker{width:100%;max-width:1000px;display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.lvl{font:inherit;font-size:13px;padding:7px 12px;border:3px solid var(--ink);border-radius:10px;background:var(--paper);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:2px;line-height:1.2;min-width:150px}
.lvl.on{background:var(--ink);color:var(--cream)}
.lvl .nm{font-weight:bold;letter-spacing:.5px}
.lvl .st{font-size:12px;letter-spacing:2px;color:#C9962B}
.lvl.on .st{color:#F0C043}
.wrap{width:100%;max-width:1000px;border:4px solid var(--ink);border-radius:14px;overflow:hidden;background:#EAF3FB;position:relative}
canvas{display:block;width:100%;height:auto;touch-action:none}
#banner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(247,239,225,.9)}
#banner.on{display:flex}
#card{text-align:center;max-width:460px;padding:0 20px}
#card p.big{margin:0 0 6px;font-size:34px;text-transform:uppercase;letter-spacing:1px}
#stars{font-size:40px;letter-spacing:6px;color:#C9962B;margin:0 0 10px;min-height:48px}
#lines{margin:0 0 16px;font-size:15px;color:var(--mute);line-height:1.8}
#lines b{color:var(--ink)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{font:inherit;font-size:16px;padding:10px 20px;border:3px solid var(--ink);border-radius:10px;background:var(--paper);cursor:pointer}
button:active{transform:translateY(1px)}
#hud{width:100%;max-width:1000px;display:flex;align-items:center;gap:20px;margin-top:12px;font-size:15px;flex-wrap:wrap}
#hud b{font-size:20px}
#hud .right{margin-left:auto;display:flex;gap:10px;align-items:center}
#pnl{font-variant-numeric:tabular-nums}
.tip{width:100%;max-width:1000px;margin-top:10px;font-size:13px;color:var(--mute);line-height:1.6}
</style>
</head>
<body>
<header>
<h1>Angry Bulls</h1><span class="sub">Bulls vs bears</span>
</header>
<div id="picker"></div>
<div class="wrap">
<canvas id="cv" width="1000" height="620"></canvas>
<div id="banner"><div id="card">
<p class="big" id="banner-text">Cleared</p>
<p id="stars"></p>
<p id="lines"></p>
<div class="btns"><button id="again">Replay level</button><button id="next">Next level</button></div>
</div></div>
</div>
<div id="hud">
<span>Bears <b id="left">5</b></span>
<span>Shots <b id="shots">6</b></span>
<span>P&amp;L <b id="pnl">$0</b></span>
<span class="right"><span>Best <b id="best">$0</b></span><button id="reset">Restart level</button></span>
</div>
<p class="tip" id="tip"></p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(function(){
/*LEVELS_START*/
// Pure geometry and level data. No DOM, no Matter. The headless test harness
// evaluates exactly this block, so it must stay free of browser globals.
var CW=1000,CH=620;      // canvas size
var GT=580;              // top surface of the ground
var PW=34,PH=50;         // upright candle: width, height
var BH=24;               // beam candle height
var STOREY=PH+BH;        // 74 px per storey
var BEAR_R=22;
var SIGN_W=118,SIGN_H=44;

// One upright standing on the surface at y=base.
function post(x,base,t){return{x:x,y:base-PH/2,w:PW,h:PH,t:t};}
// One beam lying across the tops of a pair of uprights.
function beam(cx,base,w,t){return{x:cx,y:base-PH-BH/2,w:w,h:BH,t:t};}
// A prop firm shop sign, standing on the surface at y=base.
function sign(cx,base,logo){return{x:cx,y:base-SIGN_H/2,w:SIGN_W,h:SIGN_H,t:'s',logo:logo};}

// One storey: two uprights at cx+/-span with a beam spanning their outer edges,
// so each beam end is carried directly by an upright. Returns the new surface.
function storey(out,cx,base,span,bull){
 out.push(post(cx-span,base,bull?'g':'r'));
 out.push(post(cx+span,base,bull?'g':'r'));
 out.push(beam(cx,base,span*2+PW,bull?'r':'g'));
 return base-STOREY;
}
// A tapering tower. spans[] runs bottom to top and must shrink, so every
// upright lands well inside the beam below it. Returns the top surface y.
function tower(out,cx,base,spans){
 var b=base;
 for(var i=0;i<spans.length;i++){b=storey(out,cx,b,spans[i],i%2===0);}
 return b;
}
function bearOn(surface){return surface-BEAR_R-2;}

function levelDoubleTop(){
 var B=[],E=[],top;
 top=tower(B,400,GT,[70,60,50,40]); E.push({x:400,y:bearOn(top)});
 top=tower(B,830,GT,[70,60,50,40]); E.push({x:830,y:bearOn(top)});
 top=tower(B,615,GT,[76,62]);       E.push({x:615,y:bearOn(top)});
 E.push({x:400,y:bearOn(GT)});
 E.push({x:830,y:bearOn(GT)});
 return {id:'double-top',name:'Double Top',
  note:'Two equal highs with a soft middle. Take out a ground-floor upright and the whole high comes down.',
  shots:6,blocks:B,bears:E};
}
function levelHeadShoulders(){
 var B=[],E=[],top;
 top=tower(B,380,GT,[66,56,46]);       E.push({x:380,y:bearOn(top)});
 top=tower(B,620,GT,[70,60,50,40,32]); E.push({x:620,y:bearOn(top)});
 top=tower(B,860,GT,[66,56,46]);       E.push({x:860,y:bearOn(top)});
 E.push({x:380,y:bearOn(GT)});
 E.push({x:620,y:bearOn(GT)});
 E.push({x:860,y:bearOn(GT)});
 return {id:'head-shoulders',name:'Head and Shoulders',
  note:'The head is tall and top heavy. Knock its base out and it falls into a shoulder.',
  shots:6,blocks:B,bears:E};
}
function levelBullFlag(){
 var B=[],E=[],top;
 top=tower(B,360,GT,[66,56,46,38,30]); E.push({x:360,y:bearOn(top)});
 top=tower(B,560,GT,[62,50,40]);       E.push({x:560,y:bearOn(top)});
 top=tower(B,730,GT,[58,46]);          E.push({x:730,y:bearOn(top)});
 top=tower(B,890,GT,[56]);             E.push({x:890,y:bearOn(top)});
 E.push({x:360,y:bearOn(GT)});
 E.push({x:560,y:bearOn(GT)});
 return {id:'bull-flag',name:'Bull Flag',
  note:'A tall pole then a drift lower. The pole is the heaviest thing on the board, so make it fall right.',
  shots:6,blocks:B,bears:E};
}
// Three funded-account shops. The names are jokes, not the real firms.
function levelPropFirm(){
 var B=[],E=[],top;
 top=tower(B,380,GT,[70,58,46]); B.push(sign(380,top,0)); E.push({x:380,y:bearOn(top-SIGN_H)});
 top=tower(B,620,GT,[70,58,46]); B.push(sign(620,top,1));
 top=tower(B,860,GT,[70,58,46]); B.push(sign(860,top,2)); E.push({x:860,y:bearOn(top-SIGN_H)});
 E.push({x:380,y:bearOn(GT)});
 E.push({x:620,y:bearOn(GT)});
 E.push({x:860,y:bearOn(GT)});
 return {id:'prop-firm',name:'Prop Firm Row',
  note:'Three funded-account shops: Regrets, Misstep and LMFAO. Each shop sign pays $5,000 on the way down. Consistency rule not included.',
  shots:6,blocks:B,bears:E};
}
var LEVELS=[levelDoubleTop(),levelHeadShoulders(),levelBullFlag(),levelPropFirm()];

// Every physical constant lives here, inside the shared block, so the game and
// the headless harness can never drift apart. Tuned by the harness, not by eye.
var PHYS={
 gravity:1,
 positionIterations:16, velocityIterations:10, constraintIterations:4,
 // Sleeping stays OFF. See the note next to the engine.
 sleeping:false,
 sling:{x:150,y:392},
 ground:{friction:1,frictionStatic:1.2,slop:0.05},
 candle:{restitution:0,friction:0.85,frictionStatic:1.1,frictionAir:0.012,slop:0.05,density:0.0026},
 bear:  {restitution:0,friction:0.95,frictionStatic:1.2,frictionAir:0.012,slop:0.05,density:0.0016},
 bull:  {restitution:0.35,friction:0.6,frictionAir:0.012,slop:0.05,density:0.016},
 bullR:23, maxPull:115, power:0.386,
 hpPost:3, hpBeam:4, hpSign:4,
 breakAt:7, breakStep:6,     // block damage = ceil((v - breakAt) / breakStep)
 // Bears take damage rather than dying on one speed threshold, so a heavy beam
 // dropping on a bear from a storey up crushes it even though it is not fast.
 bearHp:100,
 bearHurt:2.2,               // relative speed below this does nothing at all
 crushCap:30,                // cap on the other body's mass: the ground is static,
                             // so its mass is Infinity and would do infinite damage
 crushScale:2.4,             // impact damage per unit of (speed x mass)
 // A bear pinned under rubble takes almost no impacts, so it would sit there
 // alive and unreachable and the level could never be finished. Resting weight
 // above crushLoad drains it. One beam alone is under the threshold on purpose.
 crushLoad:16,
 crushRate:0.03              // hp lost per tick per unit of mass over crushLoad
};
// Matter's resting normal impulse is mass x gravity x scale x delta squared, so
// dividing an impulse by this converts it back into a mass. That matters because
// the load on a buried bear must count the whole stack above it, not just the
// one block touching it. Counting contact masses missed three quarters of a pile.
PHYS.impulsePerMass=PHYS.gravity*0.001*Math.pow(1000/60,2);
function contactLoad(pair){
 var c=pair.contacts||[],imp=0;
 for(var i=0;i<c.length;i++){if(c[i]&&c[i].normalImpulse)imp+=Math.abs(c[i].normalImpulse);}
 return imp/PHYS.impulsePerMass;
}
function damageAt(v){return Math.ceil((v-PHYS.breakAt)/PHYS.breakStep);}
function bearDamage(v,otherMass){
 if(v<=PHYS.bearHurt)return 0;
 return (v-PHYS.bearHurt)*Math.min(otherMass,PHYS.crushCap)*PHYS.crushScale;
}

// The board is walled. Without walls the ground ran far wider than the canvas
// and a bear could roll off the visible board, still alive and impossible to
// hit, so the level could never be cleared.
function edgeSpecs(){
 return [
  {kind:'ground',x:CW/2,   y:GT+16,  w:CW,   h:32},
  {kind:'wall',  x:-20,    y:CH/2,   w:40,   h:CH*3},
  {kind:'wall',  x:CW+20,  y:CH/2,   w:40,   h:CH*3},
  {kind:'sling', x:PHYS.sling.x, y:GT-74, w:22, h:148}
 ];
}

// Scoring, in dollars of profit.
var PAY_BEAR=2500,PAY_BLOCK=400,PAY_SIGN=5000,PAY_SHOT=3000;
function blockPay(spec){return spec.t==='s'?PAY_SIGN:PAY_BLOCK;}
function maxScore(L){
 var b=0;
 L.blocks.forEach(function(s){b+=blockPay(s);});
 return L.bears.length*PAY_BEAR+b+(L.shots-1)*PAY_SHOT;
}
function starCuts(L){var m=maxScore(L);return [Math.round(m*0.50),Math.round(m*0.68),Math.round(m*0.82)];}
/*LEVELS_END*/

var M=window.Matter,W=1000,H=620,INK='#1E1410';
var cv=document.getElementById('cv');

// Sleeping stays OFF. A sleeping body only wakes on an applied force, a
// collision with a moving body, or its own motion. Knock the support out from
// under one and none of those three fire, so it hangs in mid air. That was the
// floating tower bug in v1.2. Stability now comes from geometry and the solver.
var engine=M.Engine.create();
engine.gravity.y=PHYS.gravity;
engine.enableSleeping=PHYS.sleeping;
engine.positionIterations=PHYS.positionIterations;
engine.velocityIterations=PHYS.velocityIterations;
engine.constraintIterations=PHYS.constraintIterations;

var render=M.Render.create({canvas:cv,engine:engine,options:{width:W,height:H,wireframes:false,background:'#EAF3FB'}});
M.Render.run(render);
M.Runner.run(M.Runner.create(),engine);
var ctx=render.context;

var START=PHYS.sling,MAXPULL=PHYS.maxPull,POWER=PHYS.power,BULL_R=PHYS.bullR;
// Aim preview constants, fitted against the engine itself by the headless
// harness. Matter integrates v = v*(1-frictionAir) + gravity*scale*delta^2,
// so the dotted arc has to damp and drop the same way or it lies to the player.
var DAMP=0.988,GDROP=0.278;
var GREEN='#2E9E5B',RED='#D9453A';

var lvl=0,blocks=[],bears=[],bulls=[],active=null,shots=6,score=0;
var dragging=false,mx=0,my=0,over=false,pops=[],saved=readSave();

/* ---------- saved best scores ---------- */
function readSave(){
 try{var r=localStorage.getItem('angry-bulls-v2');return r?JSON.parse(r):{};}catch(e){return {};}
}
function writeSave(){
 try{localStorage.setItem('angry-bulls-v2',JSON.stringify(saved));}catch(e){}
}
function starsFor(L,s){var c=starCuts(L),n=0;for(var i=0;i<3;i++){if(s>=c[i])n=i+1;}return n;}
function pips(n){return '★★★'.slice(0,n)+'☆☆☆'.slice(0,3-n);}
function money(n){return '$'+n.toLocaleString('en-US');}

/* ---------- bodies ---------- */
function opts(base,extra){var o={},k;for(k in base)o[k]=base[k];for(k in extra)o[k]=extra[k];return o;}
function candle(spec){
 var isSign=spec.t==='s';
 var b=M.Bodies.rectangle(spec.x,spec.y,spec.w,spec.h,opts(PHYS.candle,{label:'candle',
  render:{fillStyle:isSign?'#FFFFFF':(spec.t==='g'?GREEN:RED),strokeStyle:INK,lineWidth:isSign?3:2}}));
 b.hp=isSign?PHYS.hpSign:(spec.h>spec.w?PHYS.hpPost:PHYS.hpBeam); // uprights snap sooner than beams
 b.pay=blockPay(spec);
 if(isSign)b.logo=spec.logo;
 blocks.push(b);
 return b;
}
function bear(x,y){
 var b=M.Bodies.circle(x,y,BEAR_R,opts(PHYS.bear,{label:'bear',render:{visible:false}}));
 M.Body.setInertia(b,Infinity);   // bears are circles on flat beams, so lock the roll
 b.hp=PHYS.bearHp;b.load=0;
 bears.push(b);
 return b;
}

function build(){
 var L=LEVELS[lvl];
 M.Composite.clear(engine.world,false);
 blocks=[];bears=[];bulls=[];active=null;pops=[];
 shots=L.shots;score=0;over=false;
 document.getElementById('banner').classList.remove('on');
 var skin={ground:'#7FA85C',sling:'#8B5E3C',wall:'#EAF3FB'};
 var parts=edgeSpecs().map(function(e){
  return M.Bodies.rectangle(e.x,e.y,e.w,e.h,opts(PHYS.ground,{isStatic:true,
   render:{fillStyle:skin[e.kind],strokeStyle:skin[e.kind],lineWidth:1}}));
 });
 L.blocks.forEach(function(s){parts.push(candle(s));});
 L.bears.forEach(function(s){parts.push(bear(s.x,s.y));});
 M.Composite.add(engine.world,parts);
 spawn();paint();
}
function spawn(){
 if(shots<=0)return;
 active=M.Bodies.circle(START.x,START.y,BULL_R,opts(PHYS.bull,{sleepThreshold:Infinity,label:'bull',render:{visible:false}}));
 M.Body.setStatic(active,true);
 active.launched=false;active.rest=0;
 bulls.push(active);
 M.Composite.add(engine.world,active);
}

/* ---------- hud ---------- */
function paint(){
 var L=LEVELS[lvl];
 document.getElementById('left').textContent=bears.length;
 document.getElementById('shots').textContent=Math.max(shots,0);
 document.getElementById('pnl').textContent=money(score);
 document.getElementById('best').textContent=money(saved[L.id]?saved[L.id].best:0);
 document.getElementById('tip').textContent=L.note+' Drag the bull back from the sling and let go.';
}
function drawPicker(){
 var p=document.getElementById('picker');
 p.innerHTML='';
 LEVELS.forEach(function(L,i){
  var b=document.createElement('button');
  b.className='lvl'+(i===lvl?' on':'');
  b.innerHTML='<span class="nm">'+(i+1)+'. '+L.name+'</span><span class="st">'+pips(saved[L.id]?saved[L.id].stars:0)+'</span>';
  b.addEventListener('click',function(){lvl=i;build();drawPicker();});
  p.appendChild(b);
 });
}

/* ---------- scoring ---------- */
function award(n,x,y,txt){
 score+=n;
 pops.push({x:x,y:y,txt:txt||('+'+money(n)),t:0});
 paint();
}
function finish(win){
 if(over)return;
 over=true;
 var L=LEVELS[lvl],bonus=0;
 if(win&&shots>0){bonus=shots*PAY_SHOT;score+=bonus;}
 var st=win?starsFor(L,score):0;
 var prev=saved[L.id]||{best:0,stars:0};
 if(score>prev.best||st>prev.stars){
  saved[L.id]={best:Math.max(score,prev.best),stars:Math.max(st,prev.stars)};
  writeSave();
 }
 document.getElementById('banner-text').textContent=win?'Position closed':'Stopped out';
 document.getElementById('stars').textContent=win?pips(st):'';
 var html='Trade P&amp;L <b>'+money(score-bonus)+'</b>';
 if(bonus)html+='<br>Unused risk, '+shots+' shots <b>+'+money(bonus)+'</b>';
 html+='<br>Total <b>'+money(score)+'</b>';
 html+='<br>Best on this level <b>'+money(saved[L.id]?saved[L.id].best:score)+'</b>';
 document.getElementById('lines').innerHTML=html;
 document.getElementById('next').style.display=(win&&lvl<LEVELS.length-1)?'':'none';
 document.getElementById('banner').classList.add('on');
 paint();drawPicker();
}
function check(){
 if(over)return;
 if(bears.length===0){finish(true);return;}
 if(shots<=0&&!active){
  var moving=false;
  bulls.concat(blocks).forEach(function(b){if(b.speed>0.6)moving=true;});
  if(!moving)finish(false);
 }
}

/* ---------- damage ---------- */
function relSpeed(a,b){return Math.hypot(a.velocity.x-b.velocity.x,a.velocity.y-b.velocity.y);}
function killBear(b){
 M.Composite.remove(engine.world,b);
 bears=bears.filter(function(x){return x!==b;});
 award(PAY_BEAR,b.position.x,b.position.y-30);
 check();
}
function breakBlock(b){
 M.Composite.remove(engine.world,b);
 blocks=blocks.filter(function(x){return x!==b;});
 award(b.pay||PAY_BLOCK,b.position.x,b.position.y);
}
M.Events.on(engine,'collisionStart',function(e){
 e.pairs.forEach(function(p){
  var v=relSpeed(p.bodyA,p.bodyB);
  [[p.bodyA,p.bodyB],[p.bodyB,p.bodyA]].forEach(function(pr){
   var b=pr[0],o=pr[1];
   if(over)return;
   if(b.label==='bear'&&bears.indexOf(b)>=0){
    b.hp-=bearDamage(v,o.mass);
    if(b.hp<=0)killBear(b);
    return;
   }
   if(b.label==='candle'&&v>PHYS.breakAt&&blocks.indexOf(b)>=0){
    b.hp-=damageAt(v);
    if(b.hp<=0)breakBlock(b);
   }
  });
 });
});
// Weight resting on a bear, measured from the solver's own contact impulse so
// the whole pile above counts, not just the one block in contact. Only bodies
// whose centre is above the bear count, so a bear standing on a beam is safe.
M.Events.on(engine,'collisionActive',function(e){
 e.pairs.forEach(function(p){
  [[p.bodyA,p.bodyB],[p.bodyB,p.bodyA]].forEach(function(pr){
   var b=pr[0],o=pr[1];
   if(b.label!=='bear'||o.isStatic)return;
   if(o.position.y<b.position.y)b.load+=contactLoad(p);
  });
 });
});

/* ---------- input ---------- */
function pos(ev){
 var r=cv.getBoundingClientRect();
 var t=ev.touches&&ev.touches.length?ev.touches[0]:ev;
 return{x:(t.clientX-r.left)*(W/r.width),y:(t.clientY-r.top)*(H/r.height)};
}
function down(ev){
 if(!active||active.launched||over)return;
 var p=pos(ev);
 if(Math.hypot(p.x-START.x,p.y-START.y)<95){dragging=true;mx=p.x;my=p.y;ev.preventDefault();}
}
function move(ev){if(!dragging)return;var p=pos(ev);mx=p.x;my=p.y;ev.preventDefault();}
function up(){
 if(!dragging||!active)return;
 dragging=false;
 if(Math.hypot(mx-START.x,my-START.y)<10)return;
 var dp=pullPoint(),dx=START.x-dp.x,dy=START.y-dp.y;
 // setStatic is the real un-freeze. Assigning isStatic directly leaves the
 // inverse mass at zero, so the body would take the velocity and ignore it.
 M.Body.setStatic(active,false);
 M.Sleeping.set(active,false);
 active.launched=true;shots--;paint();
 M.Body.setVelocity(active,{x:dx*POWER,y:dy*POWER});
 active=null;
 setTimeout(function(){if(!over){spawn();check();}},2200);
}
cv.addEventListener('mousedown',down);
window.addEventListener('mousemove',move);
window.addEventListener('mouseup',up);
cv.addEventListener('touchstart',down,{passive:false});
cv.addEventListener('touchmove',move,{passive:false});
window.addEventListener('touchend',up);

/* ---------- housekeeping each tick ---------- */
M.Events.on(engine,'afterUpdate',function(){
 for(var i=bulls.length-1;i>=0;i--){
  var b=bulls[i];
  if(b===active)continue;
  if(b.position.y>H+120||b.position.x>W+120||b.position.x<-120){
   M.Composite.remove(engine.world,b);bulls.splice(i,1);continue;
  }
  if(b.launched){
   b.rest=b.speed<0.5?b.rest+1:0;
   if(b.rest>90){M.Composite.remove(engine.world,b);bulls.splice(i,1);}
  }
 }
 for(var j=bears.length-1;j>=0;j--){
  var br=bears[j];
  if(br.position.y>H+60){killBear(br);continue;}
  if(br.load>PHYS.crushLoad)br.hp-=(br.load-PHYS.crushLoad)*PHYS.crushRate;
  br.load=0;
  if(br.hp<=0)killBear(br);
 }
 for(var k=blocks.length-1;k>=0;k--){
  var c=blocks[k];
  if(c.position.y>H+120||c.position.x>W+200||c.position.x<-200){
   M.Composite.remove(engine.world,c);blocks.splice(k,1);
  }
 }
 check();
});

/* ---------- character art ---------- */
function faceArt(g,r,browOut,browIn){
 g.fillStyle='#FFFFFF';
 g.beginPath();g.ellipse(-0.36*r,-0.20*r,0.27*r,0.24*r,0,0,6.3);g.fill();
 g.beginPath();g.ellipse(0.36*r,-0.20*r,0.27*r,0.24*r,0,0,6.3);g.fill();
 g.fillStyle=INK;
 g.beginPath();g.arc(-0.28*r,-0.15*r,0.12*r,0,6.3);g.fill();
 g.beginPath();g.arc(0.28*r,-0.15*r,0.12*r,0,6.3);g.fill();
 g.strokeStyle=INK;g.lineCap='round';g.lineWidth=0.20*r;
 g.beginPath();g.moveTo(-0.70*r,browOut*r);g.lineTo(-0.16*r,browIn*r);g.stroke();
 g.beginPath();g.moveTo(0.70*r,browOut*r);g.lineTo(0.16*r,browIn*r);g.stroke();
}
function bullArt(g,r){
 g.strokeStyle=INK;g.lineJoin='round';
 g.fillStyle='#F5E6C8';g.lineWidth=0.13*r;
 g.beginPath();g.moveTo(-0.80*r,-0.62*r);g.quadraticCurveTo(-1.55*r,-1.05*r,-1.30*r,-1.45*r);g.quadraticCurveTo(-1.00*r,-1.15*r,-0.48*r,-0.95*r);g.closePath();g.fill();g.stroke();
 g.beginPath();g.moveTo(0.80*r,-0.62*r);g.quadraticCurveTo(1.55*r,-1.05*r,1.30*r,-1.45*r);g.quadraticCurveTo(1.00*r,-1.15*r,0.48*r,-0.95*r);g.closePath();g.fill();g.stroke();
 g.fillStyle='#B03A2E';g.lineWidth=0.11*r;
 g.beginPath();g.ellipse(-0.98*r,0.04*r,0.34*r,0.22*r,0,0,6.3);g.fill();g.stroke();
 g.beginPath();g.ellipse(0.98*r,0.04*r,0.34*r,0.22*r,0,0,6.3);g.fill();g.stroke();
 g.fillStyle='#D9453A';g.lineWidth=0.15*r;
 g.beginPath();g.arc(0,0,r,0,6.3);g.fill();g.stroke();
 g.fillStyle='#E85C4A';
 g.beginPath();g.ellipse(0,-0.36*r,0.80*r,0.42*r,0,0,6.3);g.fill();
 g.fillStyle='#F2D9C4';g.lineWidth=0.11*r;
 g.beginPath();g.ellipse(0,0.46*r,0.62*r,0.42*r,0,0,6.3);g.fill();g.stroke();
 g.fillStyle='#3A2118';
 g.beginPath();g.ellipse(-0.22*r,0.38*r,0.10*r,0.13*r,0,0,6.3);g.fill();
 g.beginPath();g.ellipse(0.22*r,0.38*r,0.10*r,0.13*r,0,0,6.3);g.fill();
 g.strokeStyle='#E8B033';g.lineWidth=0.10*r;
 g.beginPath();g.arc(0,0.86*r,0.25*r,0,6.3);g.stroke();
 faceArt(g,r,-0.66,-0.38);
}
function bearArt(g,r){
 g.strokeStyle=INK;g.lineWidth=0.11*r;
 g.fillStyle='#4E3423';
 g.beginPath();g.arc(-0.66*r,-0.74*r,0.34*r,0,6.3);g.fill();g.stroke();
 g.beginPath();g.arc(0.66*r,-0.74*r,0.34*r,0,6.3);g.fill();g.stroke();
 g.fillStyle='#6B4A33';g.lineWidth=0.14*r;
 g.beginPath();g.arc(0,0,r,0,6.3);g.fill();g.stroke();
 g.fillStyle='#C9A882';g.lineWidth=0.10*r;
 g.beginPath();g.ellipse(0,0.42*r,0.55*r,0.38*r,0,0,6.3);g.fill();g.stroke();
 g.fillStyle=INK;
 g.beginPath();g.ellipse(0,0.22*r,0.16*r,0.11*r,0,0,6.3);g.fill();

}
/* ---------- prop firm shop signs ---------- */
// Parody names and original marks. These are jokes about the funded-account
// model, not the branding of any real firm.
function logoPeak(g,r){          // Regrets: a summit that did not hold
 g.fillStyle='#1F3A5F';g.strokeStyle=INK;g.lineWidth=2;
 g.beginPath();g.arc(0,0,r*0.94,0,6.3);g.fill();g.stroke();
 g.fillStyle='#FFFFFF';
 g.beginPath();g.moveTo(-r*0.62,r*0.44);g.lineTo(-r*0.14,-r*0.52);g.lineTo(r*0.34,r*0.44);g.closePath();g.fill();
 g.strokeStyle='#E4574C';g.lineWidth=2.6;g.lineCap='round';g.lineJoin='round';
 g.beginPath();g.moveTo(r*0.46,-r*0.46);g.lineTo(r*0.46,r*0.3);g.stroke();
 g.beginPath();g.moveTo(r*0.2,r*0.06);g.lineTo(r*0.46,r*0.36);g.lineTo(r*0.72,r*0.06);g.stroke();
}
function logoSteps(g,r){         // Misstep: the top step goes over
 g.fillStyle='#C9962B';g.strokeStyle=INK;g.lineWidth=2;
 g.beginPath();g.arc(0,0,r*0.94,0,6.3);g.fill();g.stroke();
 g.fillStyle='#FFFFFF';
 g.fillRect(-r*0.66,r*0.02,r*0.32,r*0.5);
 g.fillRect(-r*0.26,-r*0.26,r*0.32,r*0.78);
 g.save();g.translate(r*0.36,-r*0.3);g.rotate(0.75);
 g.fillRect(-r*0.16,-r*0.3,r*0.32,r*0.6);
 g.restore();
}
function logoLaugh(g,r){         // LMFAO
 g.fillStyle='#F0C043';g.strokeStyle=INK;g.lineWidth=2;
 g.beginPath();g.arc(0,0,r*0.94,0,6.3);g.fill();g.stroke();
 g.strokeStyle=INK;g.lineWidth=2.2;g.lineCap='round';
 g.beginPath();g.arc(-r*0.34,-r*0.12,r*0.2,3.45,5.98);g.stroke();
 g.beginPath();g.arc(r*0.34,-r*0.12,r*0.2,3.45,5.98);g.stroke();
 g.fillStyle=INK;
 g.beginPath();g.arc(0,r*0.08,r*0.46,0.22,2.92);g.fill();
 g.fillStyle='#FFFFFF';
 g.beginPath();g.arc(0,r*0.52,r*0.17,3.34,6.08);g.fill();
}
var FIRMS=[
 // Tim's names. Original marks, drawn in the game's own style.
 {name:'REGRETS',draw:logoPeak},
 {name:'MISSTEP',draw:logoSteps},
 {name:'LMFAO',draw:logoLaugh}
];
// Only the mark and the name. Matter already draws the white board underneath.
function signArt(g,w,h,firm){
 g.save();g.translate(-w/2+24,0);firm.draw(g,13);g.restore();
 var size=14,maxW=w-52;
 do{g.font='bold '+size+'px "Trebuchet MS",Verdana,sans-serif';size--;}
 while(g.measureText(firm.name).width>maxW&&size>6);
 g.fillStyle=INK;g.textAlign='left';g.textBaseline='middle';
 g.fillText(firm.name,-w/2+42,1);
 g.textAlign='start';g.textBaseline='alphabetic';
}

var SS=3;
function sprite(fn,r){
 var half=Math.ceil(r*1.9),c=document.createElement('canvas');
 c.width=c.height=half*2*SS;
 var g=c.getContext('2d');g.scale(SS,SS);g.translate(half,half);
 fn(g,r);
 return{img:c,half:half};
}
var SP_BULL=sprite(bullArt,BULL_R),SP_BEAR=sprite(bearArt,BEAR_R);
function boardSprite(firm,w,h){
 var c=document.createElement('canvas');
 c.width=w*SS;c.height=h*SS;
 var g=c.getContext('2d');g.scale(SS,SS);g.translate(w/2,h/2);
 signArt(g,w,h,firm);
 return{img:c,w:w,h:h};
}
var SP_SIGN=FIRMS.map(function(f){return boardSprite(f,SIGN_W,SIGN_H);});
function stampBoard(sp,x,y,a){
 ctx.save();ctx.translate(x,y);ctx.rotate(a);
 ctx.drawImage(sp.img,-sp.w/2,-sp.h/2,sp.w,sp.h);
 ctx.restore();
}
function stamp(s,x,y,a){
 ctx.save();ctx.translate(x,y);ctx.rotate(a);
 ctx.drawImage(s.img,-s.half,-s.half,s.half*2,s.half*2);
 ctx.restore();
}

// Where the bull actually sits while you drag: the pull, capped at MAXPULL.
function pullPoint(){
 var dx=mx-START.x,dy=my-START.y,d=Math.hypot(dx,dy)||1;
 var cap=Math.min(d,MAXPULL)/d;
 return{x:START.x+dx*cap,y:START.y+dy*cap};
}
M.Events.on(render,'afterRender',function(){
 var dp=null;
 if(dragging&&active){
  dp=pullPoint();
  ctx.strokeStyle=INK;ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(START.x-10,442);ctx.lineTo(dp.x,dp.y);ctx.lineTo(START.x+10,442);ctx.stroke();
  var vx=(START.x-dp.x)*POWER,vy=(START.y-dp.y)*POWER,px=dp.x,py=dp.y;
  // Stop the dotted path where the shot would actually land, so the preview
  // does not draw a line straight through a tower it cannot pass through.
  var solids=M.Composite.allBodies(engine.world).filter(function(b){return b!==active;});
  ctx.fillStyle='rgba(30,20,16,0.33)';
  for(var i=0;i<40;i++){
   vx*=DAMP;vy=vy*DAMP+GDROP;
   px+=vx;py+=vy;
   if(px>W+40||py>H+40)break;
   if(M.Query.point(solids,{x:px,y:py}).length)break;
   ctx.beginPath();ctx.arc(px,py,3,0,6.3);ctx.fill();
  }
 }
 // The leverage joke. Full pull is 100 percent, and the bar goes red there.
 if(dragging&&active){
  var pct=Math.round(Math.min(Math.hypot(mx-START.x,my-START.y),MAXPULL)/MAXPULL*100);
  var maxed=pct>=100,bx=30,by=42,bw=180,bh=18;
  ctx.font='bold 13px "Trebuchet MS",Verdana,sans-serif';
  ctx.textAlign='left';
  ctx.fillStyle=maxed?'#D9453A':'#6B5A4A';
  ctx.fillText(maxed?'MAX LEVERAGE 100%':'LEVERAGE '+pct+'%',bx,by-8);
  ctx.fillStyle='#FFFFFF';ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle=maxed?'#D9453A':(pct>75?'#C9962B':'#2E9E5B');
  ctx.fillRect(bx+3,by+3,(bw-6)*pct/100,bh-6);
  ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.strokeRect(bx,by,bw,bh);
  ctx.textAlign='start';
 }
 blocks.forEach(function(b){
  if(b.logo!=null)stampBoard(SP_SIGN[b.logo],b.position.x,b.position.y,b.angle);
 });
 bears.forEach(function(b){
  stamp(SP_BEAR,b.position.x,b.position.y,b.angle);
  // A ring showing what is left of a bear being crushed. It only appears once
  // a bear is properly hurt, because settling a tower costs every bear a point
  // or two and a near-full ring on every bear at level start reads as noise.
  if(b.hp<PHYS.bearHp*0.9){
   ctx.beginPath();
   ctx.arc(b.position.x,b.position.y,BEAR_R+7,-1.5708,-1.5708+6.2832*Math.max(b.hp,0)/PHYS.bearHp);
   ctx.strokeStyle='#D9453A';ctx.lineWidth=4;ctx.lineCap='round';ctx.stroke();
  }
 });
 bulls.forEach(function(b){
  if(b===active&&dp)stamp(SP_BULL,dp.x,dp.y,0);
  else stamp(SP_BULL,b.position.x,b.position.y,b.angle);
 });
 ctx.font='bold 20px "Trebuchet MS",Verdana,sans-serif';
 ctx.textAlign='center';
 for(var k=pops.length-1;k>=0;k--){
  var p=pops[k];p.t++;p.y-=0.9;
  if(p.t>70){pops.splice(k,1);continue;}
  ctx.globalAlpha=Math.max(0,1-p.t/70);
  ctx.fillStyle='#1E1410';ctx.fillText(p.txt,p.x,p.y);
  ctx.globalAlpha=1;
 }
 ctx.textAlign='start';
});

document.getElementById('reset').addEventListener('click',function(){build();drawPicker();});
document.getElementById('again').addEventListener('click',function(){build();drawPicker();});
document.getElementById('next').addEventListener('click',function(){
 if(lvl<LEVELS.length-1)lvl++;
 build();drawPicker();
});

drawPicker();build();
})();
</script>
